[package]
name = "truthlinked-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
postcard = { version = "1.1", features = ["alloc"] }
rand = "0.8"
rand_chacha = "0.3"
rand_core = "0.6"
bip39 = "2.2.2"
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
hkdf = "0.12"
argon2 = "0.5"
aes-gcm = "0.10"
blake3 = "1.5"
wasmparser = "0.121"

fips204 = { version = "0.4", features = ["ml-dsa-65"] }
fips203 = "0.4"

# optional: prompt for encrypted keyfiles in CLI usage
rpassword = "7.3"
